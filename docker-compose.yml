services:
  whiterabbitneo:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: whiterabbitneo
    init: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    command:
      - --model
      - /models/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf
      - --alias
      - qwen2.5-7b-instruct
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "32768"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --threads
      - "4"
      - --parallel
      - "1"
      - --jinja
      - --api-key
      - ${WHITERABBIT_API_KEY:?Set WHITERABBIT_API_KEY in .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 10 http://localhost:8080/health | grep -q 'ok'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  hexstrike:
    build:
      context: ./hexstrike-ai
    container_name: hexstrike-ai
    init: true
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./hexstrike-work:/work
    environment:
      - HEXSTRIKE_HOST=0.0.0.0
      - HEXSTRIKE_PORT=8888
    command:
      - /opt/hexstrike-env/bin/python
      - hexstrike_server.py
      - --port
      - "8888"
